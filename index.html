    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-blue"/></marker>
      <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-teal"/></marker>
      <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-orange"/></marker>
      <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-red"/></marker>
      <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-green"/></marker>

    </defs>
  </svg>

  <div id="app" class="layout three">
    <!-- ========== 왼쪽: 목차 ========== -->

        </a>
        <div class="brand-text">
          <div class="brand-title">Docker 쉽게 배우기</div>
          <div class="brand-sub">컨테이너 · Compose · 쿠버네티스</div>
        </div>
        <button class="icon-btn" id="navCloseBtn" title="목차 접기">⟨</button>
      </div>
      <div class="progress-wrap">
        <div class="progress-label"><span>학습 진도</span><span id="progressText">0 / 0</span></div>
        <div class="progress"><div class="progress-fill" id="progressBar"></div></div>
      </div>
      <input id="navSearch" class="nav-search" type="search" placeholder="🔍 강의 · 용어 검색">
      <nav id="navTree" class="nav-tree" aria-label="강의 목차"></nav>
      <div class="nav-foot">
        <button class="btn tiny ghost" id="themeBtn" title="라이트/다크">🌓 테마</button>
        <span class="spacer"></span>
        <a class="btn tiny ghost" href="https://docs.docker.com/" target="_blank" rel="noopener">📘 공식 문서</a>
      </div>
    </aside>

    <!-- ========== 가운데: 강의 ========== -->
    <main class="center">
      <header class="topbar">
        <button class="icon-btn nav-open" id="navOpenBtn" title="목차 열기">☰</button>
        <div class="crumb" id="crumb"></div>
        <span class="spacer"></span>
        <button class="icon-btn" id="prevBtn" title="이전 장">◀</button>
        <button class="icon-btn" id="nextBtn" title="다음 장">▶</button>
        <button class="btn small lab-toggle" id="labToggle" title="실습 화면 열기/닫기">🧪 실습</button>
      </header>
      <div id="content" class="content" tabindex="-1"></div>
    </main>

    <div id="splitter" class="splitter" title="끌어서 크기 조절 (두 번 누르면 기본 크기)"></div>

    <!-- ========== 오른쪽: 실습 결과 ========== -->
    <section id="lab" class="lab" aria-label="실습 화면">
      <div class="lab-head">
        <div class="lab-tabs" role="tablist">
          <button class="lab-tab on" data-pane="term" role="tab">🖥️ <span>터미널</span></button>
          <button class="lab-tab" data-pane="dash" role="tab">📊 <span>대시보드</span></button>
          <button class="lab-tab" data-pane="browser" role="tab">🌐 <span>브라우저</span></button>
          <button class="lab-tab" data-pane="files" role="tab">📝 <span>파일</span></button>
          <button class="lab-tab" data-pane="missions" role="tab">🎯 <span>미션</span><b class="badge" id="missionBadge"></b></button>
        </div>
        <span class="spacer"></span>
        <button class="icon-btn" id="labReset" title="실습 환경 초기화 (컨테이너 · 이미지 · 파일 모두 처음 상태로)">↺</button>
        <button class="icon-btn" id="labWide" title="넓게 보기">⤢</button>
        <button class="icon-btn" id="labClose" title="실습 화면 닫기">✕</button>
      </div>
      <div class="lab-body">
        <div class="pane on" data-pane="term" id="paneTerm"></div>
        <div class="pane" data-pane="dash" id="paneDash"></div>
        <div class="pane" data-pane="browser" id="paneBrowser"></div>
        <div class="pane" data-pane="files" id="paneFiles"></div>
        <div class="pane" data-pane="missions" id="paneMissions"></div>
      </div>
    </section>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head"><b id="modalTitle"></b><span class="spacer"></span><button class="icon-btn" id="modalClose">✕</button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
